<style>
/* Asiste — panel de la clínica. Denso y tranquilo: hecho para usarse 8 horas al día. */
:root {
  --paper: #f5f2ec; --bg: #f7f5f0; --card: #fffdf9; --ink: #16211d; --ink-2: #3b4641; --muted: #6a726c;
  --line: #e4ded3; --line-2: #efeae1; --green: #0f4c3a; --green-2: #1d6b53; --mint: #dcebe0; --mint-2: #eef6f0;
  --terra: #b4532a; --terra-bg: #f8e6dc; --sand: #e7b58f; --amber: #9a6a00; --amber-bg: #fbf0d4; --red: #a8322b; --red-bg: #f9e1de;
  --blue: #2a5d84; --blue-bg: #e3edf5; --r: 12px;
  --serif: 'Instrument Serif', Georgia, serif; --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--green); }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.boot { display: grid; place-items: center; height: 100vh; color: var(--muted); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--green); background: var(--green); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--green-2); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: var(--card); color: var(--green); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--green); background: var(--mint-2); }
.btn.danger, .btn.ghost.danger { color: var(--red); }
.btn.ghost.danger:hover { border-color: var(--red); background: var(--red-bg); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn.xs { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.btn.wide { width: 100%; height: 44px; }
.btn.light { background: #fff; color: var(--green); border-color: #fff; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--line-2); }

/* Ingreso */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--paper); }
.login-card { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 30px; display: grid; gap: 14px; }
.login-card h1 { font-family: var(--serif); font-weight: 400; font-size: 32px; margin: 4px 0 6px; }
.login-err { color: var(--red); margin: 0; min-height: 1em; font-size: 13.5px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.logo-mark { width: 28px; height: 28px; }

/* Estructura */
.layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; background: linear-gradient(90deg, var(--paper) 239px, var(--line) 239px 240px, var(--bg) 240px); }
.layout.has-banner { grid-template-rows: auto 1fr; }
.demo-banner { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 20px; background: var(--ink); color: #f5f2ec; font-size: 13.5px; }
.demo-banner a:not(.btn) { color: var(--sand); }
.side { background: var(--paper); border-right: 1px solid var(--line); align-self: start; padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.has-banner .side { height: calc(100vh - 52px); top: 0; }
.side .brand { padding: 4px 10px; }
.clinic-name { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.clinic-name small { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.clinic-name b { font-size: 14px; line-height: 1.3; display: block; }
.side nav { display: grid; gap: 2px; }
.nav-link { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav-link:hover { background: var(--line-2); }
.nav-link.active { background: var(--card); color: var(--green); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.nav-link .count[hidden] { display: none; }
.nav-link .count { margin-left: auto; background: var(--terra); color: #fff; font-size: 11.5px; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; }
.side-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 10px; border-top: 1px solid var(--line); }
.who b { display: block; font-size: 13.5px; }
.who small { color: var(--muted); font-size: 12px; }
.mtop { display: none; }
.main { padding: 26px 32px 60px; min-width: 0; outline: none; }

/* Encabezados */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.page-head h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
.page-head.slim h1 { font-size: 32px; }
.page-head p { margin: 6px 0 0; max-width: 60em; }
.eyebrow { margin: 0 0 6px; color: var(--terra); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.head-note { display: flex; align-items: center; gap: 8px; color: var(--green); background: var(--mint-2); border: 1px solid var(--mint); padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; }
.head-note .i { width: 16px; height: 16px; }
.sticky-actions { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 12px 0; margin-top: -12px; border-bottom: 1px solid var(--line); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--card); margin-bottom: 18px; }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line-2); }
.kpi:first-child { border-left: 0; }
.kpi small { display: block; color: var(--muted); font-size: 12.5px; }
.kpi b { display: block; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; margin: 2px 0; }
.kpi span { color: var(--muted); font-size: 12px; }
.kpi.accent b { color: var(--green); }

/* Tarjetas */
.grid-main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 14px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card h2 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
.badge { background: var(--terra); color: #fff; border-radius: 99px; font-size: 12px; padding: 1px 8px; font-weight: 600; }
.badge.warn { background: var(--amber); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty p { margin: 0 0 4px; color: var(--ink-2); font-weight: 500; }

.day-list { list-style: none; margin: 0; padding: 0; }
.day-list li { display: grid; grid-template-columns: 76px 1fr 22px auto auto; gap: 12px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line-2); }
.day-list li:first-child { border-top: 0; }
.day-list li.done { opacity: .62; }
.day-list .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.day-list .who b { display: block; font-weight: 600; }
.day-list .who small { color: var(--muted); }
.src { color: var(--green); display: grid; place-items: center; }
.src .i { width: 16px; height: 16px; }
.row-actions { display: flex; gap: 6px; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
.st-booked { background: var(--blue-bg); color: var(--blue); }
.st-confirmed { background: var(--mint); color: var(--green); }
.st-deposit, .st-pending_deposit { background: var(--amber-bg); color: var(--amber); }
.st-done, .st-completed { background: var(--line-2); color: var(--muted); }
.st-noshow, .st-no_show { background: var(--red-bg); color: var(--red); }
.st-cancel, .st-cancelled { background: var(--line-2); color: var(--muted); text-decoration: line-through; }

.att-list { list-style: none; margin: 0; padding: 0; }
.att-list li { border-top: 1px solid var(--line-2); }
.att-list li:first-child { border-top: 0; }
.att-list a, .att-list .dep { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; text-decoration: none; color: inherit; }
.att-list a:hover { background: var(--mint-2); }
.att-list b { display: block; font-weight: 600; }
.att-list small { color: var(--muted); }
.att-list li.urgent .av { background: var(--red-bg); color: var(--red); }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; line-height: 1; background: var(--mint); color: var(--green); font-weight: 700; font-size: 12.5px; flex: none; }
.av.sm { width: 28px; height: 28px; font-size: 11px; }
.av.lg { width: 40px; height: 40px; }
.av .i { width: 16px; height: 16px; }

.chart-card .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.lg::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.lg.bot::before { background: var(--green); }
.lg.staff::before { background: var(--sand); }
.bars { width: 100%; height: auto; }
.bars .grid { stroke: var(--line-2); }
.bars .b-bot { fill: var(--green); }
.bars .b-staff { fill: var(--sand); }
.bars text { font-size: 11px; fill: var(--muted); font-family: var(--sans); }

/* Conversaciones */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
.inbox { display: grid; grid-template-columns: 340px 1fr; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); height: calc(100vh - 190px); min-height: 520px; overflow: hidden; }
.has-banner .inbox { height: calc(100vh - 240px); }
.conv-side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.conv-side .tabs { padding: 0 10px; margin: 0; }
.conv-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.conv-list li { border-bottom: 1px solid var(--line-2); position: relative; }
.conv-list li.none { padding: 20px; color: var(--muted); }
.conv-list button { display: grid; grid-template-columns: 34px 1fr; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; cursor: pointer; }
.conv-list li:hover { background: var(--bg); }
.conv-list li.open { background: var(--mint-2); box-shadow: inset 3px 0 0 var(--green); }
.conv-list li.att .av { background: var(--terra-bg); color: var(--terra); }
.conv-list li.urgent .av { background: var(--red-bg); color: var(--red); }
.conv-list .meta { min-width: 0; }
.conv-list .line1 { display: flex; justify-content: space-between; gap: 8px; }
.conv-list .line1 b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-list .line1 small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.conv-list .line2 { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.conv-list .line2 > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-list .dot { position: absolute; right: 14px; top: 34px; width: 9px; height: 9px; border-radius: 50%; background: var(--terra); }
.tag { font-style: normal; font-size: 11px; font-weight: 700; background: var(--terra-bg); color: var(--terra); padding: 1px 6px; border-radius: 4px; flex: none; }
.tag.urgent { background: var(--red-bg); color: var(--red); }
.tag.soft { background: var(--blue-bg); color: var(--blue); }
.conv-pane { display: grid; grid-template-columns: 1fr 250px; min-height: 0; min-width: 0; }
.conv-pane > .empty { grid-column: 1 / -1; align-self: center; }
.conv-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.conv-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.conv-head b { display: block; }
.conv-head small { color: var(--muted); }
.conv-head .back { display: none; }
.conv-actions { margin-left: auto; }
.conv-alert { display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: var(--terra-bg); color: var(--terra); font-weight: 500; font-size: 13.5px; }
.conv-alert.urgent { background: var(--red-bg); color: var(--red); }
.msgs { flex: 1; overflow-y: auto; padding: 16px 18px; background: #efe9df; display: flex; flex-direction: column; gap: 6px; }
.msg-day { align-self: center; font-size: 11.5px; color: var(--muted); background: var(--card); padding: 2px 10px; border-radius: 6px; margin: 8px 0; }
.bubble { max-width: 74%; padding: 7px 10px 6px; border-radius: 10px; background: #fff; position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
.bubble p { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
.bubble time { display: block; text-align: right; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.bubble.in { align-self: flex-start; border-top-left-radius: 3px; }
.bubble.out { align-self: flex-end; background: #dff3d3; border-top-right-radius: 3px; }
.bubble.out.staff { background: #dde9f4; }
.bubble .by { display: block; font-size: 11px; font-weight: 700; color: var(--green); margin-bottom: 2px; }
.bubble .by.staff { color: var(--blue); }
.bubble .qr { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.bubble .qr span { font-size: 12px; border: 1px solid rgba(15,76,58,.25); color: var(--green); border-radius: 6px; padding: 2px 8px; background: rgba(255,255,255,.6); }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; min-height: 40px; max-height: 140px; background: #fff; }
.composer textarea:focus { outline: 2px solid var(--green); outline-offset: 0; }
.composer .btn { height: 40px; width: 44px; padding: 0; }
.conv-info { border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; }
.conv-info h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 8px; }
.mini-appt { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; display: grid; gap: 3px; justify-items: start; }
.mini-appt small { color: var(--muted); }
.mini-appt.past { opacity: .8; }

/* Agenda */
.cal-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.nav-week { display: flex; align-items: center; gap: 6px; }
.week-title { font-size: 16px; margin: 0 0 0 8px; }
.cal-tools { display: flex; gap: 8px; align-items: center; }
.cal-tools select, .field select { height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--card); font: inherit; }
.cal-scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.cal { display: grid; grid-template-columns: 56px repeat(var(--cols), minmax(120px, 1fr)); min-width: 680px; }
.cal-corner { border-bottom: 1px solid var(--line); }
.cal-dayhead { padding: 8px 10px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line-2); display: flex; align-items: baseline; gap: 6px; position: sticky; top: 0; background: var(--card); }
.cal-dayhead small { color: var(--muted); text-transform: uppercase; font-size: 11.5px; letter-spacing: .05em; }
.cal-dayhead b { font-size: 18px; font-weight: 600; }
.cal-dayhead.today b { background: var(--green); color: #fff; border-radius: 99px; padding: 0 8px; font-size: 15px; }
.cal-hours div { font-size: 11px; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-7px); }
.cal-col { position: relative; border-left: 1px solid var(--line-2); background: repeating-linear-gradient(to bottom, transparent 0 51px, var(--line-2) 51px 52px); }
.cal-col .open { position: absolute; left: 0; right: 0; background: rgba(220,235,224,.28); }
.ev { position: absolute; border: 0; border-left: 3px solid var(--blue); background: var(--blue-bg); color: var(--ink); border-radius: 5px; padding: 2px 6px; font-size: 11.5px; text-align: left; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; line-height: 1.25; }
.ev b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev small { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.st-confirmed { border-color: var(--green); background: var(--mint); }
.ev.st-pending_deposit { border-color: var(--amber); background: var(--amber-bg); }
.ev.st-completed { border-color: #b9b3a7; background: #f0ece4; color: var(--muted); }
.ev.st-no_show { border-color: var(--red); background: var(--red-bg); }
.ev:hover { filter: brightness(.97); box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 2; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--terra); z-index: 3; }
.now-line::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--terra); }
.cal-legend { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.slot-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 210px; overflow-y: auto; }
.slot { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
.slot:hover { border-color: var(--green); }
.slot.on { background: var(--green); color: #fff; border-color: var(--green); }

/* Tablas */
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.table { width: 100%; border-collapse: collapse; background: var(--card); }
.table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tbody tr { cursor: pointer; }
.table tbody tr:hover { background: var(--bg); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table .mono { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.cell-person { display: flex; align-items: center; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 0 10px; height: 38px; width: min(340px, 100%); color: var(--muted); }
.search input { border: 0; outline: 0; background: none; font: inherit; flex: 1; min-width: 0; color: var(--ink); }

/* Simulador */
.sim { display: grid; grid-template-columns: 400px 1fr; gap: 28px; align-items: start; }
.sim-phone { background: #ece5dd; border: 10px solid #1b1f1d; border-radius: 30px; height: min(720px, calc(100vh - 200px)); min-height: 480px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 48px -28px rgba(0,0,0,.5); }
.sim-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #1f3d33; color: #fff; }
.sim-top .av { background: var(--sand); color: var(--green); }
.sim-top small { display: block; opacity: .7; font-size: 12px; }
.sim-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.wb { max-width: 86%; padding: 7px 10px 5px; border-radius: 10px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06); font-size: 14px; line-height: 1.4; }
.wb p { margin: 0; white-space: pre-wrap; }
.wb time { display: block; text-align: right; font-size: 10.5px; color: #7b8781; }
.wb.in { align-self: flex-end; background: #d9f6c9; border-top-right-radius: 3px; }
.wb.out { align-self: flex-start; border-top-left-radius: 3px; }
.wqr { display: flex; flex-direction: column; gap: 4px; align-self: flex-start; width: 86%; }
.wqr button { background: #fff; border: 0; border-radius: 8px; padding: 8px; color: #1f6b9a; font-weight: 500; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.wqr button:hover { background: #f4f9fc; }
.wlist { align-self: flex-start; width: 86%; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.wlist button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eee; background: none; padding: 9px 12px; cursor: pointer; }
.wlist button:hover { background: #f6f6f6; }
.wlist b { display: block; font-weight: 500; }
.wlist small { color: #7b8781; }
.typing { align-self: flex-start; background: #fff; border-radius: 10px; padding: 10px 12px; display: flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #9aa5a0; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .3; } }
.sim-input { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
.sim-input input { flex: 1; border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; background: #fff; min-width: 0; }
.sim-input input:focus { outline: 2px solid var(--green-2); }
.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
.sim-side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.sim-side h3:not(:first-child) { margin-top: 26px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; text-align: left; }
.chip:hover { border-color: var(--green); color: var(--green); }
.sim-log { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; min-height: 24px; }
.sim-log li { background: var(--mint-2); border: 1px solid var(--mint); color: var(--green); padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; }

/* Formularios y ajustes */
.field { display: grid; gap: 5px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field > small { color: var(--muted); font-size: 12px; }
.field input, .field textarea, .field select, .set input:not([type=checkbox]):not([type=time]), .set textarea { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; background: #fff; color: var(--ink); }
.field textarea, .set textarea { height: auto; padding: 8px 10px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus, .set input:focus, .set textarea:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: transparent; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.one { grid-template-columns: 1fr; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check.center { justify-content: center; }
.check input, .toggle input { width: 17px; height: 17px; accent-color: var(--green); }
.set { margin-bottom: 16px; padding: 20px; }
.set h2 { font-size: 17px; margin-bottom: 2px; }
.set > .muted { margin: 0 0 14px; }
.hours { display: grid; gap: 6px; margin-bottom: 16px; }
.hour-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.wins { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.win { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 2px 2px 8px; }
.win input { border: 0; background: none; font: inherit; width: 96px; }
.win .icon-btn { width: 26px; height: 26px; }
.svc-table { display: grid; gap: 6px; overflow-x: auto; }
.svc-row { display: grid; grid-template-columns: minmax(170px, 1.4fr) 70px 100px 60px 90px minmax(200px, 2fr) 34px; gap: 8px; align-items: center; min-width: 760px; }
.svc-row.head span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.svc-table > .btn, .staff-list > .btn, .faq-edit > .btn { justify-self: start; margin-top: 6px; }
.staff-list, .faq-edit { display: grid; gap: 8px; }
.staff-row { display: grid; grid-template-columns: 1.2fr 1fr auto auto 34px; gap: 10px; align-items: center; }
.day-checks { display: flex; gap: 6px; flex-wrap: wrap; }
.day-checks label { display: inline-flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); text-transform: capitalize; }
.faq-row { display: grid; grid-template-columns: 1fr 1.6fr 1fr 34px; gap: 8px; align-items: start; }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line-2); cursor: pointer; }
.toggle input { margin-top: 3px; }
.toggle b { display: block; font-weight: 600; }
.toggle small { color: var(--muted); }
.note-warn { background: var(--amber-bg); color: var(--amber); padding: 8px 10px; border-radius: 8px; font-size: 13px; }
pre.creds { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 13px; white-space: pre-wrap; user-select: all; }

/* Ventanas y avisos */
.modal-wrap { position: fixed; inset: 0; background: rgba(22,33,29,.38); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border-radius: 14px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
.modal-head h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 8px 18px 16px; overflow-y: auto; }
.modal-body .detail p { margin: 0 0 10px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line-2); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; transition: .2s; max-width: calc(100% - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--red); }

/* Responsive */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi:nth-child(4) { border-left: 0; }
  .kpi:nth-child(n+4) { border-top: 1px solid var(--line-2); }
  .conv-pane { grid-template-columns: 1fr; }
  .conv-info { display: none; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; background: var(--bg); }
  .side { position: fixed; bottom: 0; top: auto !important; left: 0; right: 0; height: auto !important; flex-direction: row; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); z-index: 20; gap: 0; }
  .side .brand, .side .clinic-name, .side-foot { display: none; }
  .side nav { display: flex; width: 100%; justify-content: space-around; gap: 0; }
  .nav-link { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 10.5px; flex: 1; text-align: center; position: relative; }
  .nav-link span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72px; }
  .nav-link.active { box-shadow: none; background: none; }
  .nav-link .count { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 17px; height: 17px; font-size: 10px; }
  .mtop { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 10; }
  .mtop .brand span { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
  .main { padding: 18px 16px 96px; }
  .grid-main { grid-template-columns: 1fr; }
  .inbox { grid-template-columns: 1fr; height: calc(100vh - 230px); }
  .conv-pane { display: none; }
  .main.conv-open .conv-side { display: none; }
  .main.conv-open .conv-pane { display: grid; }
  .conv-head .back { display: inline-grid; }
  .sim { grid-template-columns: 1fr; }
  .sim-phone { height: 70vh; }
  .demo-banner { flex-direction: row; align-items: center; text-align: left; padding: 8px 12px; font-size: 12px; gap: 10px; }
  .demo-banner > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .demo-banner .btn { height: 32px; font-size: 12.5px; padding: 0 10px; }
}
@media (max-width: 640px) {
  .page-head { flex-direction: column; align-items: stretch; }
  .page-head h1 { font-size: 30px; }
  .page-head.slim p { display: none; }
  .inbox { height: calc(100vh - 210px); }
  .day-list li { grid-template-columns: 74px 1fr auto; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { border-left: 0 !important; border-top: 1px solid var(--line-2); }
  .kpi:nth-child(-n+2) { border-top: 0; }
  .kpi:nth-child(odd):last-child { grid-column: 1 / -1; }
  .kpi b { font-size: 28px; }
  .day-list li { grid-template-columns: 74px 1fr auto; }
  .day-list .src { display: none; }
  .day-list .row-actions { grid-column: 2 / -1; }
  .form-grid { grid-template-columns: 1fr; }
  .head-note { align-self: flex-start; }
  .staff-row, .faq-row { grid-template-columns: 1fr; }
  .hour-row { grid-template-columns: 1fr; }
  .cal { min-width: 0; grid-template-columns: 48px 1fr; }
}

</style>
</head>
